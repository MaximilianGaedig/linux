%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amazon,biscuit-spi-pcm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amazon Echo Dot (2nd generation) microphone array FPGA

maintainers:
  - Maximilian Gaedig <mg@maximiliangaedig.com>

description:
  The microphone array of the Amazon Echo Dot (2nd generation, "biscuit")
  is digitised by TLV320ADC3101 ADCs whose TDM outputs feed an FPGA. The FPGA
  combines all microphone channels and a loopback of the playback I2S stream
  into frames that the SoC reads over SPI. The FPGA is configured over the
  same SPI bus by the driver. Its reference clock is the SoC CMMCLK pad,
  generated by the camera sensor interface (SENINF) timing generator.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: amazon,biscuit-spi-pcm

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  clocks:
    items:
      - description: CAMTG clock mux feeding the SENINF timing generator
      - description: SENINF timing generator clock gate
      - description: SENINF camera clock gate
      - description: LARB2 SMI clock gate
      - description: Camera SMI clock gate

  clock-names:
    items:
      - const: mclk
      - const: sen_tg
      - const: sen_cam
      - const: larb2_smi
      - const: cam_smi

  power-domains:
    maxItems: 1
    description: ISP power domain containing the SENINF registers

  pinctrl-0: true
  pinctrl-1: true
  pinctrl-2: true

  pinctrl-names:
    items:
      - const: idle
      - const: active
      - const: mclk
    description:
      I2S reference pins in their idle (GPIO) and active (I2S) state, and the
      CMMCLK pin carrying the FPGA reference clock.

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - reset-gpios
  - clocks
  - clock-names
  - power-domains
  - pinctrl-names
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-fpga@0 {
            compatible = "amazon,biscuit-spi-pcm";
            reg = <0>;
            spi-max-frequency = <50000000>;
            #sound-dai-cells = <0>;
            reset-gpios = <&pio 43 GPIO_ACTIVE_LOW>;
            pinctrl-names = "idle", "active", "mclk";
            pinctrl-0 = <&aud_pins_i2s1_idle>;
            pinctrl-1 = <&aud_pins_i2s1_active>;
            pinctrl-2 = <&aud_pins_fpga_mclk>;
            clocks = <&topckgen 1>, <&imgsys 2>, <&imgsys 3>,
                     <&imgsys 4>, <&imgsys 5>;
            clock-names = "mclk", "sen_tg", "sen_cam", "larb2_smi", "cam_smi";
            power-domains = <&spm 3>;
        };
    };
