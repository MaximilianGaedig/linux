%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8163-afe-pcm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8163 audio front end (AFE)

maintainers:
  - Maximilian Gaedig <mg@maximiliangaedig.com>

description:
  Audio front end of the MT8163 SoC. It provides the memory interface front
  end DAIs (DL1, DL2, VUL, AWB) and the I2S back end DAIs (I2S0-I2S3). The
  node is a child of the mediatek,mt8163-audsys syscon, whose regmap it uses
  to access the AFE registers.

properties:
  compatible:
    const: mediatek,mt8163-afe-pcm

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  clocks:
    minItems: 23
    maxItems: 23

  clock-names:
    items:
      - const: infrasys_aud
      - const: top_pdn_aud
      - const: top_pdn_aud_bus
      - const: aud_1_sel
      - const: aud_2_sel
      - const: apll1
      - const: apll1_tuner
      - const: apll1_div
      - const: apll2
      - const: apll2_tuner
      - const: apll2_div
      - const: afe
      - const: adc
      - const: dac
      - const: dac_predis
      - const: 22m
      - const: 24m
      - const: top_i2s
      - const: i2s0
      - const: i2s1
      - const: i2s2
      - const: i2s3
      - const: clk26m

  memory-region:
    maxItems: 1
    description: Reserved memory for the audio DMA buffers

  "#sound-dai-cells":
    const: 1

required:
  - compatible
  - interrupts
  - power-domains
  - clocks
  - clock-names

additionalProperties: false
