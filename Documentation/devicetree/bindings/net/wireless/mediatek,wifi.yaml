%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/mediatek,wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek CONSYS WiFi AHB interface

maintainers:
  - Maximilian Gaedig <mg@maximiliangaedig.com>

description:
  WiFi host interface of the MediaTek connectivity subsystem (CONSYS). WLAN
  frames are exchanged between the AP and CONSYS through this block, which
  uses the AP DMA for bulk transfers.

properties:
  compatible:
    const: mediatek,wifi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: wifi-dma

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt8163-infracfg.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        wifi@180f0000 {
            compatible = "mediatek,wifi";
            reg = <0 0x180f0000 0 0x005c>;
            interrupts = <GIC_SPI 238 IRQ_TYPE_LEVEL_LOW>;
            clocks = <&infracfg CLK_INFRA_AP_DMA>;
            clock-names = "wifi-dma";
        };
    };
